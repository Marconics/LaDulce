<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel administrativo - LaDulce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo"><div class="logo-text"><img src="fotos/logo.png" alt="LaDulce" width="150"></div></div>
    <nav class="categorias"></nav>
    <div class="header-actions"><a href="index.html" class="btn btn-outline" style="color:var(--creme);padding:9px 18px;font-size:13.5px;">Ver loja</a></div>
  </div>
</header>
<div class="admin-faixa">
  <div class="container">
    <div style="display:flex;align-items:center;gap:12px;"><span class="tag-admin">Admin</span><span>Você está no painel administrativo</span></div>
    <a href="index.html">Sair do painel</a>
  </div>
</div>
<main class="container" style="padding:40px 28px 80px;">

  <div class="admin-tabs" style="display:flex;gap:10px;margin-bottom:28px;">
    <button class="btn btn-tijolo" id="tabProdutos" type="button">Produtos</button>
    <button class="btn btn-outline" style="color:var(--tinta);border-color:var(--linha);" id="tabPedidos" type="button">Pedidos</button>
  </div>

  <section id="secaoProdutos">
    <div class="admin-topo">
      <div><h2>Produtos</h2><p>Adicione, edite ou remova os itens do cardápio da loja.</p></div>
      <button class="btn btn-tijolo" id="btnNovoProduto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Novo produto</button>
    </div>
    <div class="admin-stats" id="adminStats"></div>
    <div class="admin-grid" id="adminGrid"></div>
  </section>

  <section id="secaoPedidos" style="display:none;">
    <div class="admin-topo">
      <div><h2>Pedidos</h2><p>Acompanhe os pedidos recebidos e atualize o status de cada um.</p></div>
    </div>
    <div class="admin-stats" id="pedidosStats"></div>
    <div id="pedidosLista"></div>
  </section>

</main>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawerProduto" aria-label="Formulário de produto">
  <div class="drawer-head">
    <h2 id="tituloDrawer">Novo produto</h2>
    <button class="fechar-btn" id="fecharDrawerProduto" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body">
    <form id="formProduto" class="auth-form">
      <input type="hidden" id="pId"><input type="hidden" id="pImagemBase64"><input type="hidden" id="pImagemAtual">
      <div class="campo"><label for="pNome">Nome do produto</label><input id="pNome" type="text" placeholder="Ex: Bolo de Chocolate" required></div>
      <div class="campo"><label for="pDesc">Descrição</label><textarea id="pDesc" rows="3" placeholder="Descreva o produto em poucas palavras" required></textarea></div>
      <div class="linha-campos">
        <div class="campo"><label for="pPreco">Preço (R$)</label><input id="pPreco" type="number" min="0" step="0.01" placeholder="0,00" required></div>
        <div class="campo"><label for="pCategoria">Categoria</label><select id="pCategoria" required><option value="" disabled selected>Selecione...</option></select></div>
      </div>
      <div class="campo" style="display:flex;align-items:center;gap:10px;margin-top:4px;"><input id="pDisponivel" type="checkbox" checked style="width:auto;margin:0;"><label for="pDisponivel" style="margin:0;cursor:pointer;">Produto disponível</label></div>
      <div class="campo">
        <label for="pImagem">Foto do produto</label>
        <input id="pImagem" type="file" accept="image/*">
        <div id="previewImagem" style="margin-top:8px;"></div>
        <button type="button" id="btnRemoverFoto" style="display:none;margin-top:6px;font-size:12px;color:#888;background:none;border:none;cursor:pointer;padding:0;">✕ Remover foto</button>
      </div>
    </form>
  </div>
  <div class="drawer-footer">
    <div class="acoes-passo">
      <button class="btn btn-outline" style="color:var(--tinta);border-color:var(--linha);" id="cancelarProduto">Cancelar</button>
      <button class="btn btn-tijolo" id="salvarProduto">Salvar produto</button>
    </div>
  </div>
</aside>
<div class="toast" id="toast"></div>
<script>
/* ==========================================================================
   GUARD DE ACESSO — roda antes de qualquer outra coisa na página.
   Se não tiver token, ou não tiver usuário salvo, ou o role não for ADMIN,
   manda para o cardápio na hora (nem chega a carregar produtos/categorias).
   IMPORTANTE: isso é só a camada de UX. A proteção de verdade tem que
   existir no backend (produtos.js/categorias.js) verificando o JWT + role
   nas rotas de criar/atualizar/excluir — sem isso, qualquer pessoa pode
   chamar a API direto (Postman/curl) e ignorar essa tela completamente.
   ========================================================================== */
const token = localStorage.getItem('token')
let usuarioLogado = null
try { usuarioLogado = JSON.parse(localStorage.getItem('usuario') || 'null') } catch {}

if (!token || !usuarioLogado || usuarioLogado.role !== 'ADMIN') {
  window.location.href = 'index.html'
  throw new Error('Acesso restrito a administradores.') // interrompe o resto do script
}

const API_PRODUTOS   = 'https://ladulce.onrender.com/produtos'
const API_CATEGORIAS = 'https://ladulce.onrender.com/categorias'
const API_PEDIDOS    = 'https://ladulce.onrender.com/pedidos'
const fmt = v => "R$ " + Number(v).toFixed(2).replace(".", ",")
let editandoId = null

// Toda chamada à API já sai com o token — quando produtos.js/categorias.js
// passarem a exigir ADMIN no backend, não precisa mudar nada aqui.
async function apiFetch(url, options = {}) {
  const res = await fetch(url, {
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
      ...(options.headers || {})
    },
    ...options
  })
  if (res.status === 401 || res.status === 403) {
    window.location.href = 'index.html'
    throw new Error('Sessão expirada ou sem permissão.')
  }
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.mensagem || 'Erro na requisição') }
  return res.json().catch(() => ({}))
}

async function carregarCategorias() {
  try {
    const data = await apiFetch(API_CATEGORIAS + '/listar')
    const categorias = data?.categorias ?? []
    const select = document.getElementById('pCategoria')
    select.innerHTML = '<option value="" disabled selected>Selecione...</option>'
    categorias.forEach(c => { const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.nome; select.appendChild(opt) })
  } catch (e) { console.error('Erro ao carregar categorias:', e) }
}

function renderStats(produtos) {
  const box = document.getElementById('adminStats')
  const categoriasAtivas = new Set(produtos.map(p => p.categoriaId)).size
  const disponiveis = produtos.filter(p => p.disponivel).length
  box.innerHTML = `<div class="admin-stat"><span>Total de produtos</span><strong>${produtos.length}</strong></div><div class="admin-stat"><span>Categorias ativas</span><strong>${categoriasAtivas}</strong></div><div class="admin-stat"><span>Disponíveis</span><strong>${disponiveis}</strong></div>`
}

async function renderGrid() {
  const grid = document.getElementById('adminGrid'); grid.innerHTML = '<p style="opacity:.5;padding:20px 0;">Carregando produtos...</p>'
  let produtos = []
  try { const data = await apiFetch(API_PRODUTOS + '/listar'); produtos = data.produtos ?? [] }
  catch (e) { grid.innerHTML = '<p style="color:red;padding:20px 0;">Erro ao carregar produtos. Verifique se o servidor está rodando.</p>'; return }
  renderStats(produtos)
  if (produtos.length === 0) { grid.innerHTML = `<button class="admin-card-novo" id="btnNovoProdutoTile" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Adicionar produto</button>`; document.getElementById('btnNovoProdutoTile').onclick = abrirNovoProduto; return }
  const cards = produtos.map(p => `<div class="admin-card"><div class="admin-card-imagem">${!p.disponivel ? `<span class="admin-card-tag" style="background:#888">Indisponível</span>` : ''}${p.imagemUrl ? `<img src="${p.imagemUrl}" alt="${p.nome}" onerror="this.remove()">` : ''}</div><div class="admin-card-corpo"><span class="admin-card-cat">${p.categoria?.nome ?? ''}</span><h3>${p.nome}</h3><p>${p.descricao ?? ''}</p><div class="admin-card-rodape"><span class="admin-card-preco">${fmt(p.preco)}</span><div class="admin-card-acoes"><button class="admin-icone-btn" onclick="editarProduto(${p.id})" aria-label="Editar ${p.nome}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button><button class="admin-icone-btn excluir" onclick="excluirProduto(${p.id}, '${p.nome.replace(/'/g, "\\'")}')" aria-label="Excluir ${p.nome}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button></div></div></div></div>`).join('')
  grid.innerHTML = cards + `<button class="admin-card-novo" id="btnNovoProdutoTile" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Adicionar produto</button>`
  document.getElementById('btnNovoProdutoTile').onclick = abrirNovoProduto
}

const overlay = document.getElementById('overlay'), drawer = document.getElementById('drawerProduto')
function abrirDrawer()  { overlay.classList.add('aberto');    drawer.classList.add('aberto') }
function fecharDrawer() { overlay.classList.remove('aberto'); drawer.classList.remove('aberto') }

function limparForm() {
  document.getElementById('formProduto').reset(); document.getElementById('pId').value = ''; document.getElementById('pImagemBase64').value = ''; document.getElementById('pImagemAtual').value = ''
  document.getElementById('previewImagem').innerHTML = ''; document.getElementById('btnRemoverFoto').style.display = 'none'; document.getElementById('pDisponivel').checked = true; editandoId = null
}

function abrirNovoProduto() { limparForm(); document.getElementById('tituloDrawer').textContent = 'Novo produto'; abrirDrawer() }

async function editarProduto(id) {
  editandoId = id; document.getElementById('tituloDrawer').textContent = 'Editar produto'; limparForm(); editandoId = id
  try {
    const produto = await apiFetch(API_PRODUTOS + `/listar/${id}`)
    document.getElementById('pId').value = produto.id; document.getElementById('pNome').value = produto.nome; document.getElementById('pDesc').value = produto.descricao ?? ''
    document.getElementById('pPreco').value = produto.preco; document.getElementById('pCategoria').value = produto.categoriaId; document.getElementById('pDisponivel').checked = produto.disponivel; document.getElementById('pImagemAtual').value = produto.imagemUrl ?? ''
    if (produto.imagemUrl) { document.getElementById('previewImagem').innerHTML = `<img src="${produto.imagemUrl}" style="width:100%;border-radius:8px;">`; document.getElementById('btnRemoverFoto').style.display = 'block' }
    abrirDrawer()
  } catch (e) { mostrarToast('Erro ao carregar produto') }
}

async function excluirProduto(id, nome) {
  if (!confirm(`Remover "${nome}" do cardápio?`)) return
  try { await apiFetch(API_PRODUTOS + `/excluir/${id}`, { method: 'DELETE' }); mostrarToast(`${nome} removido do cardápio`); renderGrid() }
  catch (e) { mostrarToast('Erro ao excluir: ' + e.message) }
}

document.getElementById('btnNovoProduto').onclick      = abrirNovoProduto
document.getElementById('fecharDrawerProduto').onclick = fecharDrawer
document.getElementById('cancelarProduto').onclick     = fecharDrawer
overlay.onclick                                        = fecharDrawer

document.getElementById('pImagem').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = ev => { document.getElementById('pImagemBase64').value = ev.target.result.split(',')[1]; document.getElementById('pImagemAtual').value = ''; document.getElementById('previewImagem').innerHTML = `<img src="${ev.target.result}" style="width:100%;border-radius:8px;">`; document.getElementById('btnRemoverFoto').style.display = 'block' }
  reader.readAsDataURL(file)
})

document.getElementById('btnRemoverFoto').onclick = () => {
  document.getElementById('pImagemBase64').value = ''; document.getElementById('pImagemAtual').value = 'REMOVER'
  document.getElementById('previewImagem').innerHTML = '<span style="font-size:13px;opacity:.5;">Sem foto</span>'; document.getElementById('btnRemoverFoto').style.display = 'none'; document.getElementById('pImagem').value = ''
}

document.getElementById('salvarProduto').onclick = async () => {
  const form = document.getElementById('formProduto'); if (!form.reportValidity()) return
  const base64 = document.getElementById('pImagemBase64').value, imagemAtual = document.getElementById('pImagemAtual').value
  let imagemUrl = base64 ? base64 : imagemAtual === 'REMOVER' ? null : undefined
  const dados = { nome: document.getElementById('pNome').value.trim(), descricao: document.getElementById('pDesc').value.trim(), preco: parseFloat(document.getElementById('pPreco').value), categoriaId: parseInt(document.getElementById('pCategoria').value), disponivel: document.getElementById('pDisponivel').checked, ...(imagemUrl !== undefined && { imagemUrl }) }
  const btn = document.getElementById('salvarProduto'); btn.disabled = true; btn.textContent = 'Salvando...'
  try {
    if (editandoId) { await apiFetch(API_PRODUTOS + `/atualizar/${editandoId}`, { method: 'PUT', body: JSON.stringify(dados) }); mostrarToast('Produto atualizado') }
    else { await apiFetch(API_PRODUTOS + '/cadastrar', { method: 'POST', body: JSON.stringify(dados) }); mostrarToast('Produto adicionado ao cardápio') }
    fecharDrawer(); renderGrid()
  } catch (e) { mostrarToast('Erro ao salvar: ' + e.message) }
  finally { btn.disabled = false; btn.textContent = 'Salvar produto' }
}

let toastTimeout
function mostrarToast(msg) {
  const toast = document.getElementById('toast')
  toast.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span>' + msg + '</span>'
  toast.classList.add('mostrar'); clearTimeout(toastTimeout); toastTimeout = setTimeout(() => toast.classList.remove('mostrar'), 2400)
}

/* ==========================================================================
   ABA "PEDIDOS"
   Reaproveita apiFetch, mostrarToast e as classes de botão que já existem.
   GET /pedidos/listar retorna todos os pedidos (backend detecta que quem
   chama é ADMIN pelo token). PUT /pedidos/:id/status já valida ADMIN.
   ========================================================================== */
const STATUS_LABEL = {
  AGUARDANDO: 'Aguardando',
  EM_PREPARO: 'Em preparo',
  PRONTO:     'Pronto',
  ENTREGUE:   'Entregue',
  CANCELADO:  'Cancelado'
}

const STATUS_COR = {
  AGUARDANDO: '#a68a5b',
  EM_PREPARO: '#3b6ea5',
  PRONTO:     '#2f9e5c',
  ENTREGUE:   '#4c4c4c',
  CANCELADO:  '#b23b3b'
}

async function renderPedidos() {
  const box = document.getElementById('pedidosLista')
  box.innerHTML = '<p style="opacity:.5;padding:20px 0;">Carregando pedidos...</p>'

  let pedidos = []
  try {
    const data = await apiFetch(API_PEDIDOS + '/listar')
    pedidos = data.pedidos ?? []
  } catch (e) {
    box.innerHTML = '<p style="color:red;padding:20px 0;">Erro ao carregar pedidos.</p>'
    return
  }

  renderPedidosStats(pedidos)

  if (pedidos.length === 0) {
    box.innerHTML = '<p style="opacity:.5;padding:20px 0;">Nenhum pedido registrado ainda.</p>'
    return
  }

  box.innerHTML = `
    <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:14px;">
      <thead>
        <tr style="text-align:left;border-bottom:1px solid var(--linha);">
          <th style="padding:10px 8px;">#</th>
          <th style="padding:10px 8px;">Cliente</th>
          <th style="padding:10px 8px;">Itens</th>
          <th style="padding:10px 8px;">Tipo</th>
          <th style="padding:10px 8px;">Total</th>
          <th style="padding:10px 8px;">Pagamento</th>
          <th style="padding:10px 8px;">Data</th>
          <th style="padding:10px 8px;">Status</th>
        </tr>
      </thead>
      <tbody>
        ${pedidos.map(pedidoLinha).join('')}
      </tbody>
    </table>
    </div>
  `
}

function pedidoLinha(p) {
  const itensResumo = (p.itens || []).map(i => `${i.quantidade}x ${i.produto?.nome ?? ''}`).join(', ')
  const dataFormatada = new Date(p.criadoEm).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })

  return `
    <tr style="border-bottom:1px solid var(--linha);">
      <td style="padding:10px 8px;">#${p.id}</td>
      <td style="padding:10px 8px;">${p.usuario?.nome ?? '-'}<br><span style="opacity:.6;font-size:12px;">${p.usuario?.email ?? ''}</span></td>
      <td style="padding:10px 8px;max-width:220px;">${itensResumo}</td>
      <td style="padding:10px 8px;">${p.tipo === 'ENTREGA' ? 'Entrega' : 'Presencial'}</td>
      <td style="padding:10px 8px;">${fmt(p.total)}</td>
      <td style="padding:10px 8px;">${p.pagamento?.forma ?? '-'}</td>
      <td style="padding:10px 8px;">${dataFormatada}</td>
      <td style="padding:10px 8px;">
        <select onchange="atualizarStatusPedido(${p.id}, this.value)" style="border:1px solid var(--linha);border-radius:6px;padding:6px 8px;color:${STATUS_COR[p.status]};font-weight:600;">
          ${Object.keys(STATUS_LABEL).map(s => `<option value="${s}" ${s === p.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
        </select>
      </td>
    </tr>
  `
}

function renderPedidosStats(pedidos) {
  const box = document.getElementById('pedidosStats')
  const total = pedidos.length
  const aguardando = pedidos.filter(p => p.status === 'AGUARDANDO').length
  const emAndamento = pedidos.filter(p => ['EM_PREPARO', 'PRONTO'].includes(p.status)).length
  const entregues = pedidos.filter(p => p.status === 'ENTREGUE').length

  box.innerHTML = `
    <div class="admin-stat"><span>Total de pedidos</span><strong>${total}</strong></div>
    <div class="admin-stat"><span>Aguardando</span><strong>${aguardando}</strong></div>
    <div class="admin-stat"><span>Em andamento</span><strong>${emAndamento}</strong></div>
    <div class="admin-stat"><span>Entregues</span><strong>${entregues}</strong></div>
  `
}

async function atualizarStatusPedido(id, novoStatus) {
  try {
    await apiFetch(API_PEDIDOS + `/${id}/status`, { method: 'PUT', body: JSON.stringify({ status: novoStatus }) })
    mostrarToast('Status do pedido #' + id + ' atualizado para ' + STATUS_LABEL[novoStatus])
    renderPedidos()
  } catch (e) {
    mostrarToast('Erro ao atualizar status: ' + e.message)
    renderPedidos() // reverte o select pro valor real salvo no banco
  }
}

/* Alternância entre as abas "Produtos" e "Pedidos" */
function alternarAba(aba) {
  const secaoProdutos = document.getElementById('secaoProdutos')
  const secaoPedidos  = document.getElementById('secaoPedidos')
  const tabProdutos   = document.getElementById('tabProdutos')
  const tabPedidos    = document.getElementById('tabPedidos')

  if (aba === 'produtos') {
    secaoProdutos.style.display = ''
    secaoPedidos.style.display  = 'none'
    tabProdutos.className = 'btn btn-tijolo'
    tabPedidos.className  = 'btn btn-outline'
    tabPedidos.style.color = 'var(--tinta)'
    tabPedidos.style.borderColor = 'var(--linha)'
  } else {
    secaoProdutos.style.display = 'none'
    secaoPedidos.style.display  = ''
    tabPedidos.className  = 'btn btn-tijolo'
    tabProdutos.className = 'btn btn-outline'
    tabProdutos.style.color = 'var(--tinta)'
    tabProdutos.style.borderColor = 'var(--linha)'
    renderPedidos()
  }
}

document.getElementById('tabProdutos').onclick = () => alternarAba('produtos')
document.getElementById('tabPedidos').onclick  = () => alternarAba('pedidos')

carregarCategorias(); renderGrid()
</script>
</body>
</html>
